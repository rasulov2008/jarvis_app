<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="dark light">
  <title>HEMIS · Джарвис</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    /* Старт без вспышки: тема до первой отрисовки + предварительное соединение с ботом (адрес приходит в ?api=). */
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      var light = tg ? tg.colorScheme === "light" : matchMedia("(prefers-color-scheme: light)").matches;
      document.documentElement.dataset.theme = light ? "light" : "dark";
      var api = new URLSearchParams(location.search).get("api");
      if (api) { var l = document.createElement("link"); l.rel = "preconnect"; l.href = api; document.head.appendChild(l); }
    })();
  </script>
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="loadbar" id="loadbar"></div>
  <header class="top" id="hero">
    <div class="top-row">
      <button class="back" id="back" data-a="back" aria-label="Назад" hidden></button>
      <div class="badge" id="badge"></div>
      <div class="top-text">
        <h1 id="title">Расписание</h1>
        <p id="subtitle">&nbsp;</p>
      </div>
      <button class="stamp" id="refresh" data-a="refresh" aria-label="Обновить"><span id="stampIco"></span><span id="stamp"></span></button>
    </div>
  </header>

  <main id="view" aria-live="polite">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </main>

  <nav class="tabs" id="tabs" aria-label="Разделы"><div class="tabs-in" id="tabsIn"></div></nav>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
